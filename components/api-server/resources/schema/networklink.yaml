schemas:
  NetworkLink:
    type: object
    properties:
      id:
        type: uuid
        x-sql: "UUID PRIMARY KEY DEFAULT gen_random_uuid()"
      accesspoint:
        type: uuid
        x-references: NetworkAccessPoint
        x-sql: "UUID REFERENCES NetworkAccessPoint (id) ON DELETE CASCADE"
      connectingsite:
        type: uuid
        x-references: NetworkSite
        x-sql: "UUID REFERENCSE NetworkSite (id) ON DELETE CASCADE"
      cost:
        type: number
        x-sql: "INTEGER DEFAULT 1"
paths:
  /networklinks:
    get:
    post:
  /networklinks/{id}:
    get:
    delete:
