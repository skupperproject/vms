components:
  schemas:
    Uuid:
      type: string
      format: uuid
      description: PostgreSQL uuid value.
    Timestamptz:
      type: string
      format: date-time
      description: PostgreSQL timestamptz value.
    Interval:
      type: string
      description: |
        PostgreSQL interval second(0) value, for example "0 minutes" or "1 hour".
    ApplicationNetwork:
      type: object
      properties:
        id:
          allOf:
            - $ref: "#/components/schemas/Uuid"
