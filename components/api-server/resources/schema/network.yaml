schemas:
  Network:
    type: object
    properties:
      id:
        type: string
        x-sql: "UUID PRIMARY KEY DEFAULT gen_random_uuid()"
      name:
        type: string
        x-sql: "TEXT UNIQUE"
      type:
        enum:
          - dedicated
          - shared
        x-sql-type: NetworkType
        x-sql: "NetworkType"
      owner:
        type: string
        x-sql: "TEXT"
paths:
  /networks:
    get:
      summary: Get all networks
      responses:
        "200":
          description: All networks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Network"
    post:
      summary: Create a network
      operationId: createNetwork
      requestBody:
        required: true
        content:
          schema:
            type: object
            required:
              - name
              - type
            properties:
              name:
                type: string
              type:
                enum:
                  - dedicated
                  - shared
              owner:
                type: string
      responses:
        "201":
          description: Network successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Network"
        "400":
          description: Invalid input payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /networks/{id}:
    get:
    delete:
