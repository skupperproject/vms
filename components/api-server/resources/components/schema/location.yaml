schemas:
  Location:
    type: object
    properties:
      id:
        allOf:
          - $ref: "../common.yaml#/schemas/Uuid"
        x-sql: "UUID PRIMARY KEY DEFAULT gen_random_uuid()"
      name:
        type: string
        x-sql: "TEXT UNIQUE"
      description:
        type: string
        x-sql: "TEXT"
      labels:
        type: object
        additionalProperties:
          type: string
        x-sql: "JSONB"
        x-description: "A JSON-encoded map of key-value pairs"
paths:
  /locations:
    get:
      summary: Get list of locations
      operationId: listLocations
      tags: [Locations]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/schemas/Location"
        "400":
          $ref: "../common.yaml#/responses/BadRequest"
        "500":
          $ref: "../common.yaml#/responses/ServerError"
    post:
      summary: Create a new location
      operationId: createLocation
      tags: [Locations]
      description: Adds a new location into the database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                description:
                  type: string
                labels:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "201":
          $ref: "../common.yaml#/responses/Created"
        "400":
          $ref: "../common.yaml#/responses/BadRequest"
        "500":
          $ref: "../common.yaml#/responses/ServerError"
  /locations/{id}:
    get:
      summary: Get location by id
      operationId: readLocation
      tags: [Locations]
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the location.
          schema:
            $ref: "../common.yaml#/schemas/Uuid"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/schemas/Location"
        "400":
          $ref: "../common.yaml#/responses/BadRequest"
        "404":
          $ref: "../common.yaml#/responses/NotFound"
        "500":
          $ref: "../common.yaml#/responses/ServerError"
    put:
      summary: Update location by id
      operationId: updateLocation
      tags: [Locations]
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the location.
          schema:
            $ref: "../common.yaml#/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                labels:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/schemas/Location"
        "400":
          $ref: "../common.yaml#/responses/BadRequest"
        "404":
          $ref: "../common.yaml#/responses/NotFound"
        "500":
          $ref: "../common.yaml#/responses/ServerError"
    delete:
      summary: Delete location by id
      operationId: deleteLocation
      tags: [Locations]
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the location.
          schema:
            $ref: "../common.yaml#/schemas/Uuid"
      responses:
        "204":
          description: Location successfully deleted
        "400":
          $ref: "../common.yaml#/responses/BadRequest"
        "404":
          $ref: "../common.yaml#/responses/NotFound"
        "500":
          $ref: "../common.yaml#/responses/ServerError"
