schemas:
  ApplicationNetwork:
    type: object
    properties:
      id:
        type: uuid
        x-sql: "UUID PRIMARY KEY DEFAULT gen_random_uuid()"
      name:
        type: string
        x-sql: "TEXT"
      network:
        type: uuid
        x-references: Network
        x-sql: "UUID REFERENCES Network (id) ON DELETE CASCADE"
      vanid:
        type: string
        x-sql: "TEXT"
      starttime:
        type: timestampz
        x-sql: "TIMESTAMPZ DEFAULT now()"
      endtime:
        type: timestampz
        x-sql: "TIMESTAMPZ"
      deletedelay:
        type: interval
        x-sql: "INTERVAL SECOND (0) DEFAULT '0 minutes'"
      owner:
        type: string
        x-sql: "TEXT"
paths:
  /applicationnetworks:
    get:
    post:
  /applicationnetworks/{id}:
    get:
    put:
    delete:
