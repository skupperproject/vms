# Single-node Kind cluster for VMS integration tests.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: vms-kind
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 30085
        hostPort: 8085
        protocol: TCP
