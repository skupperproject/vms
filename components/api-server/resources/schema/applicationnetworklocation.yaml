schemas:
  ApplicationNetworkLocation:
    type: object
    properties:
      applicationnetwork:
        type: uuid
        x-references: ApplicationNetwork
        x-sql: "UUID REFERENCES ApplicationNetwork (id) ON DELETE CASCADE"
      location:
        type: uuid
        x-references: Location
        x-sql: "UUID REFERENCES Location (id) ON DELETE CASCADE"
paths:
  /applicationnetworks/{id}/locations:
    get:
    post:
  /applicationnetworks/{id}/locations/{lid}:
    delete:
  /locations/{lid}/applicationnetworks:
    get:
