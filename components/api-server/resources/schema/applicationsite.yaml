schemas:
  ApplicationSite:
    type: object
    properties:
      id:
        type: uuid
        x-sql: "UUID PRIMARY KEY DEFAULT gen_random_uuid()"
      applicationnetworklocation:
        type: uuid
        x-references: ApplicationNetworkLocation
        x-sql: "UUID REFERENCES ApplicationNetworkLocation (id) ON DELETE CASCADE"
      namespace:
        type: string
        x-sql: "TEXT"
      hostname:
        type: string
        x-sql: "TEXT"
paths:
  /applicationsites:
    get:
    post:
  /applicationsites/{id}:
    get:
    put:
    delete:
