schemas:
  Network:
    type: object
    properties:
      id:
        allOf:
          - $ref: "../common.yaml#/schemas/Uuid"
        x-sql: "UUID PRIMARY KEY DEFAULT gen_random_uuid()"
      name:
        type: string
        x-sql: "TEXT UNIQUE"
      type:
        type: string
        enum:
          - dedicated
          - shared
        x-sql: "TEXT"
      owner:
        type: string
        x-sql: "TEXT"
paths:
  /networks:
    get:
      summary: Get all networks
      operationId: listNetworks
      tags: [Networks]
      responses:
        "200":
          description: All networks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/schemas/Network"
        "400":
          $ref: "../common.yaml#/responses/BadRequest"
        "500":
          $ref: "../common.yaml#/responses/ServerError"
    post:
      summary: Create a network
      operationId: createNetwork
      tags: [Networks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - type
              properties:
                name:
                  type: string
                type:
                  type: string
                  enum:
                    - dedicated
                    - shared
                owner:
                  type: string
      responses:
        "201":
          $ref: "../common.yaml#/responses/Created"
        "400":
          $ref: "../common.yaml#/responses/BadRequest"
        "500":
          $ref: "../common.yaml#/responses/ServerError"
  /networks/{id}:
    get:
      summary: Get network by id
      operationId: readNetwork
      tags: [Networks]
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the network.
          schema:
            $ref: "../common.yaml#/schemas/Uuid"
      responses:
        "200":
          description: Network found successfully.
          content:
            application/json:
              schema:
                $ref: "#/schemas/Network"
        "400":
          $ref: "../common.yaml#/responses/BadRequest"
        "404":
          $ref: "../common.yaml#/responses/NotFound"
        "500":
          $ref: "../common.yaml#/responses/ServerError"
    delete:
      summary: Delete network by id
      operationId: deleteNetwork
      tags: [Networks]
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the network.
          schema:
            $ref: "../common.yaml#/schemas/Uuid"
      responses:
        "204":
          description: Network successfully deleted
        "400":
          $ref: "../common.yaml#/responses/BadRequest"
        "404":
          $ref: "../common.yaml#/responses/NotFound"
        "500":
          $ref: "../common.yaml#/responses/ServerError"
