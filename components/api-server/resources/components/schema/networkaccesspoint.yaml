schemas:
  NetworkAccessPoint:
    type: object
    properties:
      id:
        allOf:
          - $ref: "../common.yaml#/schemas/Uuid"
        x-sql: "UUID PRIMARY KEY DEFAULT gen_random_uuid()"
      name:
        type: string
        x-sql: "TEXT"
      networksite:
        allOf:
          - $ref: "../common.yaml#/schemas/Uuid"
        x-references: NetworkSite
        x-sql: "UUID REFERENCES NetworkSite (id)"
      kind:
        type: string
        enum:
          - inter-router
          - edge
          - normal
        x-sql: "TEXT"
      hostname:
        type: string
        x-sql: "TEXT"
      port:
        type: string
        x-sql: "TEXT"
      bindhost:
        type: string
        x-sql: "TEXT DEFAULT ''"
paths:
  /networkaccesspoints:
    get:
      summary: Get all network access points
      operationId: listNetworkAccessPoints
      tags: [NetworkAccessPoints]
      responses:
        "200":
          description: List of network access points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/schemas/NetworkAccessPoint"
        "400":
          $ref: "../common.yaml#/responses/BadRequest"
        "500":
          $ref: "../common.yaml#/responses/ServerError"
    post:
      summary: Create a new network access point
      operationId: createNetworkAccessPoint
      tags: [NetworkAccessPoints]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - networksite
              properties:
                name:
                  type: string
                networksite:
                  $ref: "../common.yaml#/schemas/Uuid"
                kind:
                  type: string
                  enum:
                    - inter-router
                    - edge
                    - normal
                hostname:
                  type: string
                port:
                  type: string
                bindhost:
                  type: string
      responses:
        "201":
          $ref: "../common.yaml#/responses/Created"
        "400":
          $ref: "../common.yaml#/responses/BadRequest"
        "404":
          $ref: "../common.yaml#/responses/NotFound"
        "500":
          $ref: "../common.yaml#/responses/ServerError"
  /networkaccesspoints/{id}:
    get:
      summary: Get network access point by id
      operationId: readNetworkAccessPoint
      tags: [NetworkAccessPoints]
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the network access point.
          schema:
            $ref: "../common.yaml#/schemas/Uuid"
      responses:
        "200":
          description: Network access point found successfully.
          content:
            application/json:
              schema:
                $ref: "#/schemas/NetworkAccessPoint"
        "400":
          $ref: "../common.yaml#/responses/BadRequest"
        "404":
          $ref: "../common.yaml#/responses/NotFound"
        "500":
          $ref: "../common.yaml#/responses/ServerError"
    delete:
      summary: Delete network access point by id
      operationId: deleteNetworkAccessPoint
      tags: [NetworkAccessPoints]
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the network access point.
          schema:
            $ref: "../common.yaml#/schemas/Uuid"
      responses:
        "204":
          description: Network access point successfully deleted
        "400":
          $ref: "../common.yaml#/responses/BadRequest"
        "404":
          $ref: "../common.yaml#/responses/NotFound"
        "500":
          $ref: "../common.yaml#/responses/ServerError"
