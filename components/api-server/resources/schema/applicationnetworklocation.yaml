schemas:
  ApplicationNetworkLocation:
    type: object
    properties:
      id:
        type: uuid
        x-sql: "UUID PRIMARY KEY DEFAULT gen_random_uuid()"
      applicationnetwork:
        type: uuid
        x-references: ApplicationNetwork
        x-sql: "UUID REFERENCES ApplicationNetwork (id) ON DELETE CASCADE"
      location:
        type: uuid
        x-references: Location
        x-sql: "UUID REFERENCES Location (id) ON DELETE CASCADE"
      locationselector:
        type: json-object
        x-sql: "JSONB"
      permittedlistenerkeys:
        type: json-list
        x-sql: "JSONB"
        x-description: |
          Policy for routing keys in listeners:
          If absent, all routing keys are permitted.
          If empty, no routing keys are permitted.
          If non-empty, only the specified routing keys are permitted.
      permittedconnectorkeys:
        type: json-list
        x-sql: "JSONB"
        x-description: |
          Policy for routing keys in connectors:
          If absent, all routing keys are permitted.
          If empty, no routing keys are permitted.
          If non-empty, only the specified routing keys are permitted.
paths:
  /applicationnetworklocations/{id}:
    get:
    put:
    delete:
  /applicationnetworks/{anid}/locations:
    get:
    post:
  /locations/{lid}/applicationnetworks:
    get:
