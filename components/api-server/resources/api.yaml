openapi: 3.0.0
info:
  title: Skupper VMS User API
  description: The API to access the operational model of a Skupper VMS system.
  version: 0.1.0
paths:
  /footprints:
    get:
      summary: Get all deployment footprints
      description: Returns a list of deployment footprints
      responses:
        "200":
          description: List of deployment footprints.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Footprint"
  /footprints/${id}:
    get:
      summary: Get a deployment footprint by id
      description: Returns the deployment footprint referenced by id
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the footprint.
          schema:
            type: string
      responses:
        "200":
          description: Footprint found successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Footprint"
        "404":
          description: Footprint not found
  /deploymenttargets:
    get:
      summary: Get all deployment targets
      responses:
        "200":
          description: List of deployment targets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeploymentTarget"
  /deploymenttargets/${id}:
    get:
      summary: Get deployment target by id
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the deployment target.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentTarget"
        "404":
          description: Deployment target not found
  /locations:
    get:
      summary: Get list of locations
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"
    post:
      summary: Create a new locations
      description: Adds a new location or location class into the database
      operationId: createLocation
      requestBody:
        required: true
        content:
          schema:
            type: object
            required:
              - name
              - isclass
            properties:
              name:
                type: string
              description:
                type: string
              isclass:
                type: boolean
      responses:
        "201":
          description: Location successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          description: Invalid input payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /locations/${id}:
    get:
      summary: Get location by id
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the location.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "404":
          description: Location not found
    put:
      summary: Update location by id
      operationId: updateLocation
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the location.
          schema:
            type: string
      requestBody:
        required: true
        content:
          schema:
            type: object
            required:
              - description
            properties:
              description:
                type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          description: Invalid input payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "404":
          description: Location not found
    delete:
      summary: Delete location by id
      operationId: deleteLocation
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the location.
          schema:
            type: string
      responses:
        "204":
          description: Location successfully deleted
        "403":
          description: Forbidden. The authenticated user lacks permission to delete this resource.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "400":
          description: Invalid input payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "404":
          description: Location not found
components:
  schemas:
    Footprint:
      type: object
      properties:
        id:
          type: string
          x-sql: "UUID PRIMARY KEY DEFAULT gen_random_uuid()"
        name:
          type: string
          x-sql: "TEXT UNIQUE"
        apiurl:
          type: string
          x-sql: "TEXT"
    DeploymentTarget:
      type: object
      properties:
        id:
          type: string
          x-sql: "UUID PRIMARY KEY DEFAULT gen_random_uuid()"
        name:
          type: string
          x-sql: "TEXT UNIQUE"
        footprint:
          type: string
          x-references: Footprint
          x-sql: "UUID REFERENCES Footprint (id)"
        repositorypath:
          type: string
          x-sql: "TEXT"
        status:
          enum:
            - never-connected
            - connected
            - disconnected
          x-sql-type: DeploymentTargetStatus
          x-sql: "DeploymentTargetStatus DEFAULT 'never-connected'"
        changestatus:
          enum:
            - never-configured
            - awaiting-trigger
            - awaiting-review
            - updating-repo
            - syncing-repo
            - up-to-date
          x-sql-type: DeploymentTargetChangeStatus
          x-sql: "DeploymentTargetChangeStatus DEFAULT 'never-configured'"
    Location:
      type: object
      properties:
        id:
          type: string
          x-sql: "UUID PRIMARY KEY DEFAULT gen_random_uuid()"
        name:
          type: string
          x-sql: "TEXT UNIQUE"
        description:
          type: string
          x-sql: "TEXT"
        isclass:
          type: boolean
          x-sql: "BOOLEAN DEFAULT false"
        ofclass:
          type: string
          x-references: Location
          x-sql: "UUID REFERENCES Location (id)"
