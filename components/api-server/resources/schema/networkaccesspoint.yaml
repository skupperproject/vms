schemas:
  NetworkAccessPoint:
    type: object
    properties:
      id:
        type: uuid
        x-sql: "UUID PRIMARY KEY DEFAULT gen_random_uuid()"
      name:
        type: string
        x-sql: "TEXT"
      networksite:
        type: uuid
        x-references: NetworkSite
        x-sql: "UUID REFERENCES NetworkSite (id)"
      kind:
        enum:
          - inter-router
          - edge
          - normal
        x-sql-type: AccessPointRole
        x-sql: "AccessPointRole"
      hostname:
        type: string
        x-sql: "TEXT"
      port:
        type: string
        x-sql: "TEXT"
      bindhost:
        type: string
        x-sql: "TEXT DEFAULT ''"
paths:
  /networkaccesspoints:
    get:
    post:
  /networkaccesspoints/{id}:
    get:
    delete:
