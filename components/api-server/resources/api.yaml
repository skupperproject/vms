openapi: 3.0.0
info:
  title: Skupper VMS User API
  description: The API to access the operational model of a Skupper VMS system.
  version: 0.1.0
paths:
  /footprints:
    get:
      summary: Get all deployment footprints
      description: Returns a list of deployment footprints
      responses:
        '200':
          description: List of deployment footprints.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Footprint'
  /footprints/${id}:
    get:
      summary: Get a deployment footprint by id
      description: Returns the deployment footprint referenced by id
      parameters:
        - name: id
          in: path
          required: true
          description: The uuid of the footprint.
          schema:
            type: string
      responses:
        '200':
          description: Footprint found successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Footprint'
        '404':
          description: Footprint not found.
components:
  schemas:
    Footprint:
      type: object
      properties:
        id:
          type: string
          example: 0ed452ab-6683-40e2-9672-f1c2bfe7333d
        name:
          type: string
          example: gitops-argocd
        apirul:
          type: string
          example: http://deploy-gitops-argocd:8000
